services:
  brain-mcp:
    build:
      context: .
      args:
        APP_UID: ${BRAIN_UID:-99}
        APP_GID: ${BRAIN_GID:-100}
    image: brain-mcp:latest
    container_name: brain-mcp-${BRAIN_NAME}
    restart: unless-stopped
    ports:
      - "${PORT:-3100}:${PORT:-3100}"
    environment:
      BRAIN_ROOT: /vault
      BRAIN_NAME: ${BRAIN_NAME}
      BRAIN_TOKEN: ${BRAIN_TOKEN}
      PORT: "${PORT:-3100}"
    volumes:
      # Read-only vault mount, with a narrower read-write mount nested on
      # top for just the inbox. This is load-bearing: even a bug in the
      # write path cannot touch anything outside 00-inbox/. Do not collapse
      # this into a single read-write mount.
      - ${BRAIN_VAULT_PATH}:/vault:ro
      - ${BRAIN_VAULT_PATH}/00-inbox:/vault/00-inbox:rw
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${PORT:-3100}/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
