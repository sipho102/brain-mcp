[project]
name = "brain-mcp"
version = "0.1.0"
description = "MCP server exposing a markdown PARA vault as read tools plus a single constrained write tool"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.29,<2",
  "python-frontmatter>=1.1",
  "watchfiles>=0.24",
  "uvicorn>=0.34",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
]

[project.scripts]
brain-mcp = "brain_mcp.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
